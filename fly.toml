app = "ip-bilateral-api"
primary_region = "gru"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  THIS_ISPB    = "00000000"
  THIS_NAME    = "IP Bilateral Network"
  API_KEY_ID   = "minha_key_id"
  PEER_WEBHOOK_URL = "https://placeholder.com/webhooks"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
