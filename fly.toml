app = "ip-bilateral-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  THIS_ISPB    = "00000000"
  THIS_NAME    = "IP Bilateral Network"
  API_KEY_ID   = "minha_key_id"
  PEER_WEBHOOK_URL = "https://placeholder.com/webhooks"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1

[[mounts]]
  source      = "sqlite_data"
  destination = "/data"
